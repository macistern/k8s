name: Docker Hub Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "http-service/**"
      - "job-script/**"

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: tute2781

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      http-service: ${{ steps.filter.outputs.http-service }}
      job-script: ${{ steps.filter.outputs.job-script }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            http-service:
              - 'http-service/**'
            job-script:
              - 'job-script/**'

  build-http-service:
    needs: changes
    if: needs.changes.outputs.http-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push http-service
        uses: docker/build-push-action@v6
        with:
          context: http-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/http-service:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/http-service:latest

  build-job-script:
    needs: changes
    if: needs.changes.outputs.job-script == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push my-image-py
        uses: docker/build-push-action@v6
        with:
          context: job-script
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/my-image-py:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/my-image-py:latest
