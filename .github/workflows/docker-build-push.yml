name: Docker Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "http-service/**"
      - "job-script/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::xxxxxxx:role/github-actions-deploy-role

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      http-service: ${{ steps.filter.outputs.http-service }}
      job-script: ${{ steps.filter.outputs.job-script }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            http-service:
              - 'http-service/**'
            job-script:
              - 'job-script/**'

  build-http-service:
    needs: changes
    if: needs.changes.outputs.http-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push devops-web
        uses: docker/build-push-action@v6
        with:
          context: http-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/devops-web:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/devops-web:latest

  build-job-script:
    needs: changes
    if: needs.changes.outputs.job-script == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push my-image-py
        uses: docker/build-push-action@v6
        with:
          context: job-script
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/my-image-py:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/my-image-py:latest
